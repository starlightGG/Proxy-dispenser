name: Run Discord Bot
on:
  schedule:
    - cron: '0 */6 * * *'   # Automatically re-starts the bot every 6 hours
  push:
    branches: [ main ]
  workflow_dispatch:      # Keeps the manual button there just in case
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install
    - name: Start Bot
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      run: node index.js
