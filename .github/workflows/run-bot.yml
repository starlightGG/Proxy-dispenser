name: Run Discord Bot
on:
  schedule:
    - cron: '25 */6 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: discord-bot-runtime
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Expressly allows the runner to save your data files
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Start Bot
      env:
        TOKEN: ${{ secrets.TOKEN }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        GUILD_ID: ${{ secrets.GUILD_ID }}
        REPORTS_ID: ${{ secrets.REPORTS_ID }}  

      run: node index.js

    - name: Auto-Save Data Files
      if: always()          # Runs even if the bot is manually stopped
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add data/users.json data/requested.json data/links.json || true
        git commit -m "chore: auto-save proxy links and usage metrics [skip ci]" || true
        git push || true
